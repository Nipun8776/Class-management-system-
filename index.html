<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Paper Class App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { overflow-x: hidden; touch-action: pan-y; -webkit-overflow-scrolling: touch; font-family: 'Inter', sans-serif; }
        .section-tab { display: none; }
        .section-tab.active { display: block; animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        
        #stats-sidebar { transition: transform 0.3s ease-in-out; }
        .sidebar-hidden { transform: translateX(-100%); }
        .sidebar-visible { transform: translateX(0); }
        
        .card-animate { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
        
        .noselect { -webkit-user-select: none; user-select: none; }
        input[type="date"] { position: relative; }
        input[type="date"]::-webkit-calendar-picker-indicator { position: absolute; top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        input[type="time"] { font-family: 'Courier New', monospace; cursor: pointer; }
        input[type="time"]::-webkit-calendar-picker-indicator { cursor: pointer; filter: invert(0.5); }

        /* TOAST NOTIFICATION STYLES */
        #toast-box {
            visibility: hidden; min-width: 250px; background-color: #333; color: #fff; text-align: center;
            border-radius: 50px; padding: 16px; position: fixed; z-index: 100; left: 50%; bottom: 30px;
            transform: translateX(-50%); font-size: 12px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); opacity: 0; transition: opacity 0.3s, bottom 0.3s;
        }
        #toast-box.show { visibility: visible; opacity: 1; bottom: 50px; }
        #toast-box.success { background-color: #10B981; } /* Emerald */
        #toast-box.error { background-color: #EF4444; }   /* Red */
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800">

    <div id="confirm-modal" class="fixed inset-0 bg-slate-900/80 z-[100] hidden flex items-center justify-center p-4 backdrop-blur-sm animate-fadeIn">
        <div class="bg-white rounded-3xl p-6 w-full max-w-sm shadow-2xl text-center">
            <div class="w-12 h-12 bg-red-100 rounded-full flex items-center justify-center text-red-500 text-xl mx-auto mb-4">
                <i class="fas fa-exclamation-triangle"></i>
            </div>
            <h3 class="text-sm font-black text-slate-800 uppercase tracking-widest mb-2">Are you sure?</h3>
            <p class="text-xs text-slate-500 mb-6 font-medium">This action cannot be undone.</p>
            <div class="flex gap-3">
                <button onclick="closeModal(false)" class="flex-1 py-3 rounded-xl bg-slate-100 text-slate-600 text-[10px] font-bold uppercase tracking-widest hover:bg-slate-200 transition">Cancel</button>
                <button id="modal-confirm-btn" class="flex-1 py-3 rounded-xl bg-red-500 text-white text-[10px] font-bold uppercase tracking-widest hover:bg-red-600 shadow-lg shadow-red-200 transition">Yes, Delete</button>
            </div>
        </div>
    </div>

    <div id="toast-box">Notification</div>

    <nav class="bg-white border-b border-slate-200 shadow-sm sticky top-0 z-40">
        <div class="max-w-2xl mx-auto px-4">
            <div class="flex justify-between items-center h-14">
                <div class="flex items-center space-x-3">
                    <button onclick="toggleSidebar()" class="p-2 hover:bg-slate-100 rounded-full transition text-slate-600"><i class="fas fa-bars text-lg"></i></button>
                    <div class="leading-tight">
                        <span class="block text-[10px] font-extrabold text-indigo-600 uppercase tracking-wider">PAPER CLASS</span>
                        <span class="block text-[9px] font-semibold text-slate-400 uppercase">MANAGEMENT SYSTEM</span>
                    </div>
                </div>
                <div class="flex space-x-1 bg-slate-100 p-1 rounded-lg">
                    <button onclick="switchTab('home')" class="px-3 py-1.5 text-[9px] font-bold uppercase rounded-md transition text-white bg-indigo-600 shadow-md" id="btn-home">Home</button>
                    <button onclick="switchTab('reg')" class="px-3 py-1.5 text-[9px] font-bold uppercase rounded-md transition text-slate-500 hover:text-indigo-600 hover:bg-white shadow-sm" id="btn-reg">Reg</button>
                    <button onclick="switchTab('attend')" class="px-3 py-1.5 text-[9px] font-bold uppercase rounded-md transition text-slate-500 hover:text-indigo-600 hover:bg-white shadow-sm" id="btn-attend">Attend</button>
                    <button onclick="switchTab('list')" class="px-3 py-1.5 text-[9px] font-bold uppercase rounded-md transition text-slate-500 hover:text-indigo-600 hover:bg-white shadow-sm" id="btn-list">List</button>
                </div>
            </div>
        </div>
    </nav>

    <div id="sidebar-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-slate-900/50 z-50 hidden opacity-0 transition-opacity duration-300 backdrop-blur-sm"></div>
    <div id="stats-sidebar" class="fixed top-0 left-0 h-full w-72 bg-white z-[60] shadow-2xl sidebar-hidden flex flex-col justify-between border-r border-slate-100">
        <div class="p-6">
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-xs font-black text-slate-400 uppercase tracking-[0.2em]">Dashboard</h2>
                <button onclick="toggleSidebar()" class="w-8 h-8 flex items-center justify-center bg-slate-50 rounded-full text-slate-400 hover:text-red-500 transition"><i class="fas fa-times"></i></button>
            </div>
            <div class="space-y-2">
                <button onclick="switchTab('home'); toggleSidebar();" class="w-full flex items-center p-3 text-xs font-bold text-slate-600 rounded-xl hover:bg-indigo-50 hover:text-indigo-600 transition"><i class="fas fa-home w-8"></i> Home</button>
                <button onclick="switchTab('reg'); toggleSidebar();" class="w-full flex items-center p-3 text-xs font-bold text-slate-600 rounded-xl hover:bg-indigo-50 hover:text-indigo-600 transition"><i class="fas fa-user-plus w-8"></i> Registration</button>
                <button onclick="switchTab('attend'); toggleSidebar();" class="w-full flex items-center p-3 text-xs font-bold text-slate-600 rounded-xl hover:bg-indigo-50 hover:text-indigo-600 transition"><i class="fas fa-calendar-check w-8"></i> Attendance</button>
                <button onclick="switchTab('list'); toggleSidebar();" class="w-full flex items-center p-3 text-xs font-bold text-slate-600 rounded-xl hover:bg-indigo-50 hover:text-indigo-600 transition"><i class="fas fa-id-card w-8"></i> Registry</button>
                <button onclick="switchTab('stats'); toggleSidebar();" class="w-full flex items-center p-3 text-xs font-bold text-slate-600 rounded-xl hover:bg-indigo-50 hover:text-indigo-600 transition"><i class="fas fa-chart-pie w-8"></i> Statistics</button>
            </div>
        </div>
        <div class="p-6 border-t border-slate-100 bg-slate-50 space-y-3">
             <button onclick="downloadCSV()" class="w-full py-3 rounded-xl bg-white border border-slate-200 text-[10px] font-black uppercase tracking-widest text-slate-600 shadow-sm hover:border-emerald-200 hover:text-emerald-600 transition"><i class="fas fa-download mr-2"></i> Export CSV</button>
            <button onclick="requestHardReset()" class="w-full py-3 text-[9px] font-bold text-red-400 hover:text-red-600 uppercase tracking-widest transition">Reset System</button>
        </div>
    </div>

    <main class="max-w-2xl mx-auto px-4 py-6">
        <section id="home" class="section-tab active">
            <div class="bg-white rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] p-8 border border-slate-100 min-h-[50vh] flex flex-col items-center justify-center">
                <div class="w-16 h-16 bg-indigo-50 rounded-2xl flex items-center justify-center text-indigo-500 text-2xl mb-6 shadow-inner"><i class="fas fa-search"></i></div>
                <h2 class="text-sm font-black uppercase tracking-widest text-slate-800 mb-2">Student Lookup</h2>
                <div class="w-full max-w-xs relative">
                    <input id="searchId" type="tel" maxlength="8" placeholder="Enter ID..." class="w-full bg-slate-50 border-2 border-slate-100 p-4 rounded-2xl text-center text-lg font-bold tracking-[0.2em] text-slate-700 outline-none focus:border-indigo-500 focus:bg-white transition shadow-sm placeholder:text-slate-300">
                    <button onclick="lookupStudent()" class="absolute right-2 top-2 bottom-2 aspect-square bg-indigo-600 text-white rounded-xl hover:bg-indigo-700 transition shadow-md active:scale-95"><i class="fas fa-arrow-right"></i></button>
                </div>
                <p id="searchError" class="hidden text-red-500 text-[10px] font-bold mt-4 animate-pulse"><i class="fas fa-exclamation-circle mr-1"></i> Student Not Found</p>
                <div id="studentProfile" class="hidden w-full max-w-xs mt-8 animate-fadeIn">
                    <div class="bg-slate-50 p-5 rounded-2xl border border-slate-100 text-center">
                        <div class="w-12 h-12 bg-white rounded-full mx-auto flex items-center justify-center text-indigo-500 shadow-sm mb-3 text-lg font-bold border border-slate-100"><i class="fas fa-user"></i></div>
                        <h3 id="resName" class="text-sm font-black text-slate-800 uppercase mb-1"></h3>
                        <p id="resId" class="text-xs font-mono text-slate-400 tracking-widest"></p>
                    </div>
                </div>
            </div>
        </section>

        <section id="reg" class="section-tab">
            <div class="bg-white rounded-3xl shadow-sm p-8 border border-slate-100">
                <h2 class="text-xs font-black text-slate-400 uppercase tracking-widest mb-6 text-center">New Student Registration</h2>
                <div class="flex flex-col gap-4 max-w-xs mx-auto">
                    <input id="regId" type="tel" maxlength="8" placeholder="DM Barcode (8-Digits)" class="bg-slate-50 p-4 rounded-xl border border-slate-100 text-xs font-bold tracking-widest focus:border-indigo-500 focus:bg-white outline-none transition">
                    <input id="regName" type="text" placeholder="Full Name" class="bg-slate-50 p-4 rounded-xl border border-slate-100 text-xs font-bold uppercase focus:border-indigo-500 focus:bg-white outline-none transition">
                    <div class="relative">
                        <select id="regBatch" class="w-full bg-slate-50 p-4 rounded-xl border border-slate-100 text-xs font-bold uppercase focus:border-indigo-500 outline-none appearance-none">
                            <option value="2026">2026 Batch</option>
                            <option value="2027">2027 Batch</option>
                        </select>
                        <i class="fas fa-chevron-down absolute right-4 top-4 text-slate-400 text-xs pointer-events-none"></i>
                    </div>
                    <button onclick="addStudent()" class="bg-indigo-600 text-white py-4 rounded-xl font-bold text-xs uppercase tracking-widest hover:bg-indigo-700 shadow-lg shadow-indigo-200 active:scale-95 transition mt-2">Create Profile</button>
                </div>
            </div>
        </section>

        <section id="attend" class="section-tab">
            <div class="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden">
                <div class="bg-slate-50 p-6 border-b border-slate-100">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-xs font-black text-indigo-900 uppercase tracking-widest">Attendance</h2>
                        <div class="relative group">
                            <div class="flex items-center gap-2 bg-white px-3 py-1.5 rounded-lg border border-slate-200 shadow-sm cursor-pointer hover:border-indigo-300 transition">
                                <i class="fas fa-calendar-day text-indigo-500 text-xs"></i>
                                <input type="date" id="attendPicker" onchange="renderAttendanceList()" class="bg-transparent text-[10px] font-bold text-slate-600 uppercase tracking-wider outline-none w-24 cursor-pointer">
                            </div>
                        </div>
                    </div>
                    <div class="flex gap-2">
                        <select id="attendBatchFilter" onchange="renderAttendanceList()" class="flex-1 bg-white border border-slate-200 text-slate-600 text-[9px] font-bold uppercase rounded-lg px-2 py-2 outline-none focus:border-indigo-500"><option value="All">All Batches</option><option value="2026">2026 Batch</option><option value="2027">2027 Batch</option></select>
                        <select id="attendStatusFilter" onchange="renderAttendanceList()" class="flex-1 bg-white border border-slate-200 text-slate-600 text-[9px] font-bold uppercase rounded-lg px-2 py-2 outline-none focus:border-indigo-500"><option value="All">All Status</option><option value="Present">Present Only</option><option value="Absent">Absent Only</option></select>
                    </div>
                </div>
                <div id="attendance-list-container" class="p-4 space-y-2 bg-white min-h-[400px]"></div>
            </div>
        </section>

        <section id="list" class="section-tab">
            <div class="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden">
                <div class="bg-slate-50 p-5 border-b border-slate-100 flex justify-between items-center">
                    <h2 class="text-xs font-black text-slate-500 uppercase tracking-widest">Database</h2>
                    <div class="flex gap-2">
                        <select id="batchFilter" onchange="renderFullList()" class="bg-white border border-slate-200 text-[9px] font-bold rounded-lg px-2 py-1 outline-none"><option value="All">All</option><option value="2026">2026</option><option value="2027">2027</option></select>
                        <button onclick="toggleSort()" class="bg-white border border-slate-200 px-2 py-1 rounded-lg text-[9px] font-bold text-slate-600 hover:text-indigo-600"><i id="sortIcon" class="fas fa-sort mr-1"></i> <span id="sortText">New</span></button>
                    </div>
                </div>
                <div id="full-student-list" class="p-2"></div>
            </div>
        </section>

        <section id="stats" class="section-tab">
            <div class="bg-white rounded-3xl shadow-sm border border-slate-100 p-6 min-h-[50vh]">
                <h2 class="text-xs font-black text-indigo-900 uppercase tracking-widest mb-6 text-center">Daily Statistics</h2>
                <div class="flex justify-center mb-8">
                    <div class="relative group">
                        <div class="flex items-center gap-3 bg-indigo-50 px-4 py-2 rounded-xl border border-indigo-100 shadow-sm cursor-pointer hover:border-indigo-300 transition">
                            <i class="fas fa-calendar-alt text-indigo-600 text-sm"></i>
                            <input type="date" id="statsDate" onchange="renderStatsPage()" class="bg-transparent text-xs font-black text-indigo-900 uppercase tracking-wider outline-none cursor-pointer">
                        </div>
                    </div>
                </div>
                <div class="grid grid-cols-1 gap-4">
                    <div class="bg-slate-50 p-5 rounded-2xl border border-slate-100 flex justify-between items-center"><div><p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest">Total Students</p><p id="stat-page-total" class="text-2xl font-black text-slate-700">0</p></div><div class="w-10 h-10 rounded-full bg-slate-200 flex items-center justify-center text-slate-500"><i class="fas fa-users"></i></div></div>
                    <div class="bg-emerald-50 p-5 rounded-2xl border border-emerald-100 flex justify-between items-center"><div><p class="text-[9px] font-bold text-emerald-600 uppercase tracking-widest">Present</p><p id="stat-page-present" class="text-2xl font-black text-emerald-700">0</p></div><div class="w-10 h-10 rounded-full bg-emerald-100 flex items-center justify-center text-emerald-600"><i class="fas fa-check"></i></div></div>
                    <div class="bg-rose-50 p-5 rounded-2xl border border-rose-100 flex justify-between items-center"><div><p class="text-[9px] font-bold text-rose-600 uppercase tracking-widest">Absent</p><p id="stat-page-absent" class="text-2xl font-black text-rose-700">0</p></div><div class="w-10 h-10 rounded-full bg-rose-100 flex items-center justify-center text-rose-600"><i class="fas fa-times"></i></div></div>
                </div>
            </div>
        </section>
    </main><script>
        let students = JSON.parse(localStorage.getItem('students')) || [];
        let attendance = JSON.parse(localStorage.getItem('attendance')) || [];
        let isNewestFirst = true;
        let clickTrackers = {}; 
        let pendingDeleteId = null;

        document.addEventListener("DOMContentLoaded", () => {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('attendPicker').value = today;
            document.getElementById('statsDate').value = today;
            updateStats();
            renderStatsPage();
            // --- FIX: Force Home Tab to be Active & others hidden ---
            switchTab('home'); 
        });

        // --- TOAST & MODAL SYSTEM ---
        function showToast(msg, type = 'success') {
            const toast = document.getElementById('toast-box');
            toast.innerText = msg;
            toast.className = type; 
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 3000);
        }

        function requestDeleteStudent(id) {
            pendingDeleteId = id;
            document.getElementById('confirm-modal').classList.remove('hidden');
            document.getElementById('modal-confirm-btn').onclick = function() {
                executeDeleteStudent();
            };
        }

        function requestHardReset() {
            pendingDeleteId = 'RESET';
            document.getElementById('confirm-modal').classList.remove('hidden');
            document.getElementById('modal-confirm-btn').onclick = function() {
                executeHardReset();
            };
        }

        function closeModal(val) {
            document.getElementById('confirm-modal').classList.add('hidden');
            pendingDeleteId = null;
        }

        function executeDeleteStudent() {
            if (pendingDeleteId && pendingDeleteId !== 'RESET') {
                students = students.filter(s => s.id != pendingDeleteId);
                attendance = attendance.filter(a => a.studentId != pendingDeleteId);
                localStorage.setItem('students', JSON.stringify(students));
                localStorage.setItem('attendance', JSON.stringify(attendance));
                renderFullList(); updateStats();
                showToast("Student Deleted", "success");
            }
            closeModal();
        }

        function executeHardReset() {
            if (pendingDeleteId === 'RESET') {
                localStorage.clear();
                location.reload();
            }
            closeModal();
        }

        // --- NAVIGATION ---
        function updateNavStyles(activeId) {
            ['btn-home', 'btn-reg', 'btn-attend', 'btn-list'].forEach(id => {
                const btn = document.getElementById(id);
                if(btn) btn.className = "px-3 py-1.5 text-[9px] font-bold uppercase rounded-md transition text-slate-500 hover:text-indigo-600 hover:bg-white shadow-sm";
            });
            const activeBtn = document.getElementById('btn-' + activeId);
            if(activeBtn) activeBtn.className = "px-3 py-1.5 text-[9px] font-bold uppercase rounded-md transition text-white bg-indigo-600 shadow-md";
        }

        function toggleSidebar() {
            const sb = document.getElementById('stats-sidebar');
            const ol = document.getElementById('sidebar-overlay');
            if(sb.classList.contains('sidebar-hidden')) {
                sb.classList.replace('sidebar-hidden', 'sidebar-visible');
                ol.classList.remove('hidden'); setTimeout(() => ol.classList.add('opacity-100'), 10);
            } else {
                sb.classList.replace('sidebar-visible', 'sidebar-hidden');
                ol.classList.remove('opacity-100'); setTimeout(() => ol.classList.add('hidden'), 300);
            }
        }

        function switchTab(id) {
            document.querySelectorAll('section.section-tab').forEach(s => { s.style.display = 'none'; s.classList.remove('active'); });
            const target = document.getElementById(id);
            if(target) { target.style.display = 'block'; setTimeout(() => target.classList.add('active'), 10); }
            window.scrollTo({ top: 0, behavior: 'smooth' });
            updateNavStyles(id);
            if(id === 'list') renderFullList();
            if(id === 'attend') renderAttendanceList();
            if(id === 'stats') renderStatsPage();
        }

        function toggleSort() {
            isNewestFirst = !isNewestFirst;
            document.getElementById('sortText').innerText = isNewestFirst ? "New" : "Old";
            renderFullList();
        }

        function renderStatsPage() {
            const rawDate = document.getElementById('statsDate').value;
            const selectedDate = rawDate ? new Date(rawDate.split('-')[0], rawDate.split('-')[1]-1, rawDate.split('-')[2]).toLocaleDateString() : new Date().toLocaleDateString();
            const total = students.length;
            let presentCount = 0;
            let absentCount = 0;
            attendance.forEach(record => {
                if(record.date === selectedDate) {
                    if(record.status === 'Present') presentCount++;
                    if(record.status === 'Absent') absentCount++;
                }
            });
            document.getElementById('stat-page-total').innerText = total;
            document.getElementById('stat-page-present').innerText = presentCount;
            document.getElementById('stat-page-absent').innerText = absentCount;
        }

        function updateStats() {
            document.getElementById('stat-total').innerText = students.length;
        }

        // --- DATA LOGIC ---
        function addStudent() {
            const id = document.getElementById('regId').value;
            const name = document.getElementById('regName').value;
            const batch = document.getElementById('regBatch').value;
            if(!id || id.length != 8 || !name) { showToast("Invalid Input", "error"); return; }
            if(students.some(s => s.dmId === id)) { showToast("ID Already Exists", "error"); return; }
            
            const now = new Date();
            const regDate = now.toLocaleDateString();
            const regTime = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            
            students.push({ id: Date.now(), dmId: id, name: name.toUpperCase(), batch, regDate, regTime });
            localStorage.setItem('students', JSON.stringify(students));
            showToast("Registered Successfully", "success");
            document.getElementById('regId').value = ''; document.getElementById('regName').value = '';
            updateStats();
        }

        function lookupStudent() {
            const idInput = document.getElementById('searchId');
            const s = students.find(x => x.dmId === idInput.value);
            const profile = document.getElementById('studentProfile');
            const msg = document.getElementById('noUserMsg');
            const err = document.getElementById('searchError');
            if(s) {
                profile.classList.remove('hidden'); msg.classList.add('hidden'); err.classList.add('hidden');
                document.getElementById('resName').innerText = s.name;
                document.getElementById('resId').innerText = s.dmId + " | " + s.batch;
            } else {
                profile.classList.add('hidden'); msg.classList.add('hidden'); err.classList.remove('hidden');
            }
        }

        // --- NAME CLICK RESET ---
        function tryResetAttendance(studentId, selectedDate) {
            if (!clickTrackers[studentId]) clickTrackers[studentId] = { count: 0, timer: null };
            clickTrackers[studentId].count++;
            clearTimeout(clickTrackers[studentId].timer);
            clickTrackers[studentId].timer = setTimeout(() => { clickTrackers[studentId].count = 0; }, 500);

            if (clickTrackers[studentId].count >= 3) {
                const index = attendance.findIndex(a => a.studentId === studentId && a.date === selectedDate);
                if (index > -1) {
                    attendance.splice(index, 1);
                    localStorage.setItem('attendance', JSON.stringify(attendance));
                    renderAttendanceList();
                    clickTrackers[studentId].count = 0;
                    showToast("Record Reset", "success");
                }
            }
        }

        function updateTime(studentId, newTime, type) {
            const rawDate = document.getElementById('attendPicker').value;
            const selectedDate = rawDate ? new Date(rawDate.split('-')[0], rawDate.split('-')[1]-1, rawDate.split('-')[2]).toLocaleDateString() : new Date().toLocaleDateString();
            const idx = attendance.findIndex(a => a.studentId === studentId && a.date === selectedDate);
            if (idx > -1) {
                if (type === 'in') attendance[idx].inTime = newTime;
                if (type === 'out') attendance[idx].outTime = newTime;
                localStorage.setItem('attendance', JSON.stringify(attendance));
            }
        }

        function markAttendance(studentId, type) {
            const rawDate = document.getElementById('attendPicker').value;
            const selectedDate = rawDate ? new Date(rawDate.split('-')[0], rawDate.split('-')[1]-1, rawDate.split('-')[2]).toLocaleDateString() : new Date().toLocaleDateString();
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const time = `${hours}:${minutes}`;

            const idx = attendance.findIndex(a => a.studentId === studentId && a.date === selectedDate);

            if (type === 'absent') {
                if(idx > -1) { attendance[idx].status = 'Absent'; attendance[idx].inTime = null; attendance[idx].outTime = null; }
                else { attendance.push({ studentId, date: selectedDate, status: 'Absent' }); }
            } else if (type === 'in') {
                if(idx > -1) { attendance[idx].status = 'Present'; attendance[idx].inTime = time; }
                else { attendance.push({ studentId, date: selectedDate, status: 'Present', inTime: time }); }
            } else if (type === 'out') {
                if(idx > -1) { attendance[idx].outTime = time; }
            }

            localStorage.setItem('attendance', JSON.stringify(attendance));
            renderAttendanceList();
        }

        function renderAttendanceList() {
            const container = document.getElementById('attendance-list-container');
            const activeBatch = document.getElementById('attendBatchFilter').value;
            const activeStatus = document.getElementById('attendStatusFilter').value;
            const rawDate = document.getElementById('attendPicker').value;
            const selectedDate = rawDate ? new Date(rawDate.split('-')[0], rawDate.split('-')[1]-1, rawDate.split('-')[2]).toLocaleDateString() : new Date().toLocaleDateString();

            let list = students.filter(s => activeBatch === 'All' ? true : s.batch === activeBatch);

            list = list.filter(s => {
                const record = attendance.find(a => a.studentId === s.id && a.date === selectedDate);
                const status = record ? record.status : 'None';
                if (activeStatus === 'All') return true;
                if (activeStatus === 'Present') return status === 'Present';
                if (activeStatus === 'Absent') return status === 'Absent';
                return true;
            });
            
            if(list.length === 0) {
                container.innerHTML = '<div class="text-center py-12 text-slate-300 text-[10px] font-bold uppercase tracking-widest">No Students</div>';
                return;
            }

            container.innerHTML = list.map(s => {
                const record = attendance.find(a => a.studentId === s.id && a.date === selectedDate);
                const status = record ? record.status : null; 
                const inTime = record ? record.inTime : '';
                const outTime = record ? record.outTime : '';

                let actionArea;

                if (status === 'Absent') {
                    // LOCKED: ABSENT STATE (RESET ON NAME)
                    actionArea = `
                        <div class="px-3 py-2 rounded-xl bg-rose-50 border border-rose-100 text-rose-500 flex flex-col items-center justify-center transition active:scale-95 w-24">
                            <span class="text-[10px] font-black uppercase tracking-widest"><i class="fas fa-times-circle mr-1"></i> ABSENT</span>
                        </div>`;
                } else if (status === 'Present') {
                    // LOCKED: PRESENT STATE
                    if (!outTime) {
                        // MARKED IN -> SHOW OUT BUTTON
                        actionArea = `
                            <div class="flex items-center gap-2">
                                <div class="px-2 py-1 rounded-lg bg-emerald-50 border border-emerald-100 text-emerald-600 flex flex-col items-center min-w-[50px]">
                                    <span class="text-[6px] font-bold uppercase text-emerald-400">IN</span>
                                    <input type="time" value="${inTime}" onchange="updateTime(${s.id}, this.value, 'in')" class="bg-transparent text-[9px] font-mono font-bold text-center outline-none w-14 text-emerald-700">
                                </div>
                                <button onclick="markAttendance(${s.id}, 'out')" class="w-9 h-9 rounded-full bg-white border-2 border-orange-100 text-orange-400 hover:bg-orange-50 hover:text-orange-500 hover:border-orange-300 shadow-sm transition flex items-center justify-center active:scale-90">
                                    <i class="fas fa-sign-out-alt"></i>
                                </button>
                            </div>`;
                    } else {
                        // MARKED IN & OUT (FULL PRESENT)
                        actionArea = `
                            <div class="flex gap-2">
                                <div class="px-2 py-1 rounded-lg bg-emerald-50 border border-emerald-100 text-emerald-600 flex flex-col items-center min-w-[50px]">
                                    <span class="text-[6px] font-bold uppercase text-emerald-400">IN</span>
                                    <input type="time" value="${inTime}" onchange="updateTime(${s.id}, this.value, 'in')" class="bg-transparent text-[9px] font-mono font-bold text-center outline-none w-14 text-emerald-700">
                                </div>
                                <div class="px-2 py-1 rounded-lg bg-indigo-50 border border-indigo-100 text-indigo-600 flex flex-col items-center min-w-[50px]">
                                    <span class="text-[6px] font-bold uppercase text-indigo-400">OUT</span>
                                    <input type="time" value="${outTime}" onchange="updateTime(${s.id}, this.value, 'out')" class="bg-transparent text-[9px] font-mono font-bold text-center outline-none w-14 text-indigo-700">
                                </div>
                            </div>`;
                    }
                } else {
                    // DEFAULT: P / A BUTTONS (New Design)
                    actionArea = `
                        <div class="flex gap-2">
                            <button onclick="markAttendance(${s.id}, 'in')" class="w-9 h-9 rounded-full bg-emerald-500 text-white shadow-md hover:bg-emerald-600 transition flex items-center justify-center active:scale-95 text-[10px] font-black border-2 border-white ring-2 ring-emerald-100">P</button>
                            <button onclick="markAttendance(${s.id}, 'absent')" class="w-9 h-9 rounded-full bg-white border-2 border-rose-200 text-rose-500 hover:bg-rose-50 hover:text-rose-600 transition flex items-center justify-center active:scale-95 text-[10px] font-black">A</button>
                        </div>`;
                }

                return `
                    <div class="bg-white border-b border-slate-50 p-3 flex items-center justify-between hover:bg-slate-50 transition animate-fadeIn noselect">
                        <div class="flex items-center gap-3 overflow-hidden cursor-pointer flex-1" onclick="tryResetAttendance(${s.id}, '${selectedDate}')">
                            <div class="w-9 h-9 rounded-full bg-slate-100 flex items-center justify-center text-slate-400 text-xs font-bold shrink-0 shadow-inner">
                                ${s.name.charAt(0)}
                            </div>
                            <div class="flex flex-col min-w-0">
                                <h3 class="text-[10px] font-bold text-slate-700 uppercase truncate pr-2">${s.name}</h3>
                                <p class="text-[8px] font-mono text-slate-400 tracking-wider">${s.dmId}</p>
                                ${status ? `<p class="text-[6px] text-slate-300 font-bold uppercase tracking-widest mt-0.5">TAP 3x RESET</p>` : ''}
                            </div>
                        </div>
                        <div class="shrink-0 ml-2">
                            ${actionArea}
                        </div>
                    </div>`;
            }).join('');
        }

        function renderFullList() {
            const container = document.getElementById('full-student-list');
            const activeBatch = document.getElementById('batchFilter').value;
            let list = students.filter(s => activeBatch === 'All' ? true : s.batch === activeBatch);
            if (isNewestFirst) list = [...list].reverse();
            
            if(list.length === 0) {
                container.innerHTML = '<div class="text-center py-10 text-slate-300 text-[10px] font-bold uppercase">No Records</div>';
                return;
            }

            container.innerHTML = list.map(s => `
                <div class="bg-white border border-slate-100 rounded-xl p-3 mb-2 flex items-center justify-between shadow-sm card-animate">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded-lg bg-indigo-50 text-indigo-600 flex items-center justify-center text-[10px] font-black uppercase">
                            ${s.name.charAt(0)}
                        </div>
                        <div>
                            <h3 class="text-[10px] font-black text-slate-700 uppercase">${s.name}</h3>
                            <p class="text-[8px] font-mono text-slate-400">${s.dmId}</p>
                        </div>
                    </div>
                    <button onclick="requestDeleteStudent(${s.id})" class="w-8 h-8 flex items-center justify-center text-slate-300 hover:text-red-500 hover:bg-red-50 rounded-full transition"><i class="fas fa-trash-alt text-xs"></i></button>
                </div>`).join('');
        }

        function downloadCSV() {
            if(students.length === 0) return showToast("No Data to Export", "error");
            let csvContent = "data:text/csv;charset=utf-8,ID,Name,Batch,RegDate\n";
            students.forEach(s => csvContent += `${s.dmId},${s.name},${s.batch},${s.regDate}\n`);
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "student_db.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
